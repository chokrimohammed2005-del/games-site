<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chess 2 Players</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="chess-card">

        <div class="top-area">

            <div>
                <p class="small-title">2 PLAYER CLASSIC</p>
                <h1>Chess</h1>
            </div>

            <div id="turnText" class="turn-badge">
                White Turn
            </div>

        </div>

        <div class="players">

            <div class="player-box white-player active" id="whitePlayer">
                <span class="player-piece">♔</span>

                <div>
                    <small>PLAYER 1</small>
                    <strong>White</strong>
                </div>
            </div>

            <div class="player-box black-player" id="blackPlayer">
                <span class="player-piece">♚</span>

                <div>
                    <small>PLAYER 2</small>
                    <strong>Black</strong>
                </div>
            </div>

        </div>

        <div class="board-frame">

            <div id="chessBoard" class="chess-board"></div>

        </div>

        <p id="message"></p>

        <div class="bottom-actions">

            <button id="restart">
                Restart Game
            </button>

            <a href="../../index.html" class="back-btn">
                Back to Games
            </a>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
