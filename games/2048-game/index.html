    <meta charset="UTF-8">

    <title>2048 Game</title>

    <link rel="stylesheet" href="style.css">

<body>

    <div class="game-card">

        <h1>2048</h1>

        <p id="score">
            Score: 0
        </p>

        <p class="instructions">
            Use Arrow Keys to move the tiles
        </p>

        <div
            id="gameBoard"
            class="game-board"
        ></div>

        <p id="message"></p>


        <div class="mobile-controls">

            <button id="upBtn">
                &#8593;
            </button>

            <div class="middle-controls">

                <button id="leftBtn">
                    &#8592;
                </button>

                <button id="downBtn">
                    &#8595;
                </button>

                <button id="rightBtn">
                    &#8594;
                </button>

            </div>

        </div>


        <button id="restart">
            Restart Game
        </button>

        <a
            href="../../index.html"
            class="back-btn"
        >
            Back to Games
        </a>

    </div>


    <script src="game2048.js"></script>
