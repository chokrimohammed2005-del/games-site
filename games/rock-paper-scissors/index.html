<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6P6SML24YB"></script>

    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());

        gtag('config', 'G-6P6SML24YB');
    </script>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="game-card">

        <h1>Rock Paper Scissors</h1>

        <p id="turnText">
            Player 1 - Choose your move
        </p>


        <div class="score-board">

            <div class="score-box">
                <span>Player 1</span>
                <strong id="score1">0</strong>
            </div>

            <div class="score-box">
                <span>Player 2</span>
                <strong id="score2">0</strong>
            </div>

        </div>


        <div class="choices">

            <button
                class="choice"
                data-choice="rock"
            >
                &#9994;
                <span>Rock</span>
            </button>


            <button
                class="choice"
                data-choice="paper"
            >
                &#9995;
                <span>Paper</span>
            </button>


            <button
                class="choice"
                data-choice="scissors"
            >
                &#9996;
                <span>Scissors</span>
            </button>

        </div>


        <div class="result-area">

            <p id="player1Choice">
                Player 1: ?
            </p>

            <p id="player2Choice">
                Player 2: ?
            </p>

            <p id="message"></p>

        </div>


        <button id="restart">
            Restart Game
        </button>

        <button id="resetScore">
            Reset Score
        </button>

        <a
            href="../../index.html"
            class="back-btn"
        >
            Back to Games
        </a>

    </div>


    <script src="script.js"></script>

</body>

</html>
